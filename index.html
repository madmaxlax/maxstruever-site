    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      if (/(^|\.)maxstruever\.com$/.test(location.hostname)) {
        var gtm = document.createElement('script');
        gtm.async = true;
        gtm.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-KS7GDDDP';
        document.head.appendChild(gtm);
      }
    </script>
    <meta name="color-scheme" content="light dark" />

    <title>Max Struever</title>

    <link rel="manifest" href="/manifest.json" />
    <!-- Apply the saved or system color scheme before the bundle loads to avoid a light flash. Matches MUI's mui-mode key and class selector. -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('mui-mode') || 'system';
          if (mode === 'system') mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.classList.add(mode);
        } catch (e) {}
      })();
    </script>
    <style>
      html.light { background: #f7f7f5; }
      html.dark { background: #0b1220; }
    </style>
  </head>
